# ========== api-gateway/nginx.conf ==========
# Igual que en la Práctica 5: un solo punto de entrada que enruta según la
# ruta. ÚNICO CAMBIO respecto a la Práctica 5: se agrega /api/audit, hacia
# el nuevo servicio-auditoria. Nótese que este es el único endpoint de
# servicio-auditoria -- no existe un /api/audit de "escritura". Los
# alumnos nunca le piden a este servicio que "haga" algo; solo le
# preguntan qué ha visto pasar.

server {
    listen 80;

    location /api/register {
        proxy_pass http://servicio-usuarios:3000;
    }

    location /api/login {
        proxy_pass http://servicio-usuarios:3000;
    }

    location /api/tasks {
        proxy_pass http://servicio-tareas:3000;
    }

    location /api/audit {
        proxy_pass http://servicio-auditoria:3000;
    }

    location /api/health {
        proxy_pass http://servicio-usuarios:3000;
    }
}

# ========== api-gateway/nginx.conf ==========
# CAMBIO respecto a la Práctica 6: la ruta /api/tasks ya NO va completa a
# un solo servicio. Se separa por MÉTODO HTTP -- el corazón de CQRS,
# expresado literalmente en la configuración del gateway:
#   - GET  /api/tasks/:userId  -> servicio-consultas (lado de lectura)
#   - POST /api/tasks          -> servicio-tareas     (lado de escritura)
#   - PATCH /api/tasks/:id     -> servicio-tareas     (lado de escritura)
# El navegador sigue pidiendo todo a la misma URL de siempre
# (http://localhost:4000/api/tasks/...) -- nunca se entera de que ahora
# hay dos servicios distintos respondiendo según el verbo que use.

server {
    listen 80;

    location /api/register {
        proxy_pass http://servicio-usuarios:3000;
    }

    location /api/login {
        proxy_pass http://servicio-usuarios:3000;
    }

    location /api/tasks {
        if ($request_method = GET) {
            proxy_pass http://servicio-consultas:3000;
        }
        proxy_pass http://servicio-tareas:3000;
    }

    location /api/audit {
        proxy_pass http://servicio-auditoria:3000;
    }

    location /api/health {
        proxy_pass http://servicio-usuarios:3000;
    }
}

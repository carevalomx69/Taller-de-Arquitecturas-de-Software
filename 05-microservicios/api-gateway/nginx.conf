# ========== api-gateway/nginx.conf ==========
# Este es el primer Nginx del curso que actúa como PROXY INVERSO de verdad
# (no solo sirviendo archivos estáticos, como en las prácticas 2-4). Recibe
# todas las peticiones en un solo lugar y decide, según la ruta, a cuál
# microservicio reenviarlas. El navegador solo conoce esta dirección — no
# sabe (ni le importa) que hay dos servicios distintos detrás.

server {
    listen 80;

    location /api/register {
        proxy_pass http://servicio-usuarios:3000;
    }

    location /api/login {
        proxy_pass http://servicio-usuarios:3000;
    }

    location /api/tasks {
        proxy_pass http://servicio-tareas:3000;
    }

    location /api/health {
        proxy_pass http://servicio-usuarios:3000;
    }
}

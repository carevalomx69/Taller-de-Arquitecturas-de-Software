# ========== api-gateway/nginx.conf ==========
# CAMBIO respecto a la Práctica 7: dos rutas nuevas para la Práctica 8 --
#   - GET  /api/eventos[/:id]  -> servicio-tareas (consultar la fuente de verdad)
#   - POST /api/reconstruir    -> servicio-consultas (el experimento: repetir
#                                  el historial completo y reconstruir tasks_read)
# El resto queda exactamente igual que en la Práctica 7.

server {
    listen 80;

    location /api/register {
        proxy_pass http://servicio-usuarios:3000;
    }

    location /api/login {
        proxy_pass http://servicio-usuarios:3000;
    }

    location /api/tasks {
        if ($request_method = GET) {
            proxy_pass http://servicio-consultas:3000;
        }
        proxy_pass http://servicio-tareas:3000;
    }

    location /api/eventos {
        proxy_pass http://servicio-tareas:3000;
    }

    location /api/reconstruir {
        proxy_pass http://servicio-consultas:3000;
    }

    location /api/audit {
        proxy_pass http://servicio-auditoria:3000;
    }

    location /api/health {
        proxy_pass http://servicio-usuarios:3000;
    }
}
